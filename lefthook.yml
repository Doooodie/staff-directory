pre-commit:
  parallel: true
  jobs:
    - name: backend-oxlint
      root: backend/
      glob: "backend/**/*.{ts,mjs}"
      run: npx oxlint --fix {staged_files}
      stage_fixed: true

    - name: backend-prettier
      root: backend/
      run: npx prettier --ignore-unknown --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: backend-test
      root: backend/
      run: npm test
