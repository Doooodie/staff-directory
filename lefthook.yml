pre-commit:
  parallel: true
  jobs:
    - name: backend-eslint
      root: backend/
      glob: "backend/**/*.{ts,mjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    - name: backend-prettier
      root: backend/
      run: npx prettier --ignore-unknown --write {staged_files}
      stage_fixed: true

    - name: backend-typecheck
      root: backend/
      glob: "backend/**/*.{ts,mjs}"
      run: npm run type-check

pre-push:
  jobs:
    - name: backend-test
      root: backend/
      run: npm test
